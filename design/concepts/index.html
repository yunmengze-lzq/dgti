<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OPC大赛报名通道概念图</title>
    <style>
      :root {
        color: #101828;
        background: #f5f8fc;
        font-family:
          Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system,
          BlinkMacSystemFont, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 18px 32px;
        border-bottom: 1px solid rgba(16, 24, 40, 0.08);
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(18px);
      }

      h1 {
        margin: 0;
        font-size: 20px;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      a {
        color: #155eef;
        font-size: 14px;
        font-weight: 650;
        text-decoration: none;
      }

      main {
        display: grid;
        gap: 32px;
        width: min(1280px, calc(100vw - 32px));
        margin: 32px auto 56px;
      }

      section {
        overflow: hidden;
        border: 1px solid rgba(16, 24, 40, 0.08);
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 18px 54px rgba(21, 46, 91, 0.08);
      }

      .section-title {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 20px;
        border-bottom: 1px solid rgba(16, 24, 40, 0.08);
      }

      h2 {
        margin: 0;
        font-size: 17px;
      }

      small {
        color: #667085;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
        background: #fff;
      }

      @media (max-width: 720px) {
        header {
          align-items: flex-start;
          flex-direction: column;
          padding: 16px;
        }

        main {
          width: 100%;
          margin: 16px auto 32px;
          padding: 0 12px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>OPC大赛报名通道概念图</h1>
      <nav aria-label="概念图导航">
        <a href="#frontend">官网前端</a>
        <a href="#admin">后台管理</a>
        <a href="#h5">H5移动端</a>
      </nav>
    </header>
    <main>
      <section id="frontend">
        <div class="section-title">
          <h2>官网前端长图</h2>
          <small>赛事展示、报名入口、赛道与流程</small>
        </div>
        <img src="./opc-frontend-website-long-concept.png" alt="OPC大赛报名通道官网前端长图概念" />
      </section>
      <section id="admin">
        <div class="section-title">
          <h2>后台管理长图</h2>
          <small>报名审核、材料管理、数据概览</small>
        </div>
        <img src="./opc-admin-backend-long-concept.png" alt="OPC大赛报名通道后台管理长图概念" />
      </section>
      <section id="h5">
        <div class="section-title">
          <h2>H5移动端长图</h2>
          <small>手机报名、材料上传、进度查询</small>
        </div>
        <img src="./opc-h5-mobile-long-concept.png" alt="OPC大赛报名通道H5移动端长图概念" />
      </section>
    </main>
  </body>
</html>
